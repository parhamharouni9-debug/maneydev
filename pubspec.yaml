name: pool_man
description: "پول من — ردیاب مالی شخصی"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.3
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  shamsi_date: ^1.1.1
  confetti: ^0.7.0
  rive: ^0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Vazirmatn (Persian font) is loaded via the google_fonts package below,
  # so no font files need to be manually placed in assets/.
  assets:
    - assets/animations/
